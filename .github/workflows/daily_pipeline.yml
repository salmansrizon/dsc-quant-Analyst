name: Daily Market Data Pipeline

on:
  schedule:
    - cron: '30 8 * * 0-4'  # Sun-Thu 08:30 UTC = 2:30 PM BDT (after DSE market close)
  workflow_dispatch:         # allow manual trigger from GitHub Actions UI

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      # The scrapers authenticate to BigQuery from the GCP_SERVICE_ACCOUNT_JSON
      # secret (backend/utils/bigquery_helper.py writes it to a temp key file).
      # It was previously wired to a GOOGLE_APPLICATION_CREDENTIALS secret that
      # does not exist, so every run hit DefaultCredentialsError. Fail loudly if
      # the real secret is ever missing rather than deep in a stack trace.
      - name: Check the BigQuery secret is configured
        env:
          KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_JSON is not set. The ETL cannot run without it."
            exit 1
          fi

      - name: Refresh datamatrix (full replace)
        working-directory: backend
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python dataGrid.py

      - name: Update price archive (incremental)
        working-directory: backend
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python priceArchive.py
        continue-on-error: true

      - name: Update announcements (incremental)
        working-directory: backend
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python announcement.py
        continue-on-error: true

      - name: Refresh summary and sectors cache tables
        working-directory: backend
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python refresh_cache.py
        continue-on-error: true
