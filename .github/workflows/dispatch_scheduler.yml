name: Alert & Digest Dispatch Scheduler

on:
  schedule:
    - cron: '15 9 * * 0-4'  # Sun-Thu 09:15 UTC = 45 min after the daily pipeline starts
  workflow_dispatch:         # allow manual trigger from GitHub Actions UI

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Check price alerts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python -m backend.alert_checker
        continue-on-error: true

      - name: Dispatch digests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        run: python -m backend.digest_dispatcher
        continue-on-error: true
